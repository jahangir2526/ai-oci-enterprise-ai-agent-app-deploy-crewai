[project]
name = "ai-oci-enterprise-ai-agent-app-deploy-crewai"
version = "0.1.0"
description = "Minimal CrewAI multi-agent API for OCI Generative AI hosted deployments"
authors = []
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai==1.15.18",
    "fastapi>=0.115,<1.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
serve = "ai_oci_enterprise_ai_hosted_deployment_crewai.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_oci_enterprise_ai_hosted_deployment_crewai"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.crewai]
type = "crew"
project_id = "6bcd9da7-16e0-4cad-8d04-eff7b9b626eb"
